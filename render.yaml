services:
  - type: web
    name: scda-fastapi-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONPATH
        value: ./backend
      - key: MONGO_URI
        value: "mongodb+srv://rohan1252030019_db_user:ujueHALjuKvUjqsN@cluster0.pk3r1b3.mongodb.net/?appName=Cluster0"
      - key: MONGO_DB_NAME
        value: supplychaindb
      - key: AUTONOMOUS_APPROVAL_LIMIT_USD
        value: "50000"
      - key: DOCS_ENABLED
        value: "true"
